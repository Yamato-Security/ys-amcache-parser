site_name: ys-amcache-parser
site_url: https://yamato-security.github.io/ys-amcache-parser/
repo_url: https://github.com/Yamato-Security/ys-amcache-parser
repo_name: Yamato-Security/ys-amcache-parser
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Output formats and schema: output.md
  - Validation: validation.md

plugins:
  - search

use_directory_urls: true
