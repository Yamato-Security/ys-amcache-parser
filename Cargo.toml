[workspace]
resolver = "2"
members = ["core", "forensic"]

# Single source of truth for shared fields (DRY). `version` is NOT hoisted — core and forensic
# are versioned independently.
[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Albert Hui", "Zach Mathis (@yamatosecurity)"]
repository = "https://github.com/Yamato-Security/ys-amcache-parser"
readme = "README.md"

[workspace.dependencies]
amcache-core = { package = "ys-amcache-parser-core", path = "core", version = "1.0.0" }
# Generic REGF hive parser — Amcache IS a hive, so core walks its schema with winreg-core.
winreg-core = "0.2"
forensicnomicon = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                   = { level = "warn", priority = -1 }
pedantic              = { level = "warn", priority = -1 }
correctness           = { level = "deny",  priority = -1 }
suspicious            = { level = "deny",  priority = -1 }
unwrap_used           = { level = "deny",  priority = 0  }
expect_used           = { level = "deny",  priority = 0  }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate    = { level = "allow", priority = 1 }
missing_errors_doc    = { level = "allow", priority = 1 }
missing_panics_doc    = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap    = { level = "allow", priority = 1 }
cast_sign_loss        = { level = "allow", priority = 1 }
cast_precision_loss   = { level = "allow", priority = 1 }
too_many_lines        = { level = "allow", priority = 1 }
