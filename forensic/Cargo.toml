[package]
name = "ys-amcache-parser"
version = "1.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Cross-platform Windows Amcache.hve analyzer with complete supported metadata and text, CSV, JSON, and JSONL output."
license.workspace = true
authors.workspace = true
keywords = ["forensics", "amcache", "windows", "dfir", "execution"]
categories = ["command-line-utilities", "parser-implementations"]
repository.workspace = true
readme.workspace = true

# The library keeps its name, so code using it reads `use amcache_forensic::…`.
[lib]
name = "amcache_forensic"

[dependencies]
amcache-core = { workspace = true }
winreg-core = { workspace = true }
forensicnomicon = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
same-file = { workspace = true }

[lints]
workspace = true
