[package]
name = "ys-amcache-parser-core"
version = "1.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust read-only Windows Amcache.hve reader with comprehensive InventoryApplicationFile and InventoryDevicePnp metadata."
license.workspace = true
authors.workspace = true
keywords = ["forensics", "amcache", "windows", "dfir", "execution"]
categories = ["parser-implementations"]
repository.workspace = true
readme.workspace = true
exclude = ["tests/data/", "fuzz/"]

# The library keeps its name, so code using it reads `use amcache_core::…`.
[lib]
name = "amcache_core"

[dependencies]
winreg-core = { workspace = true }

[lints]
workspace = true
